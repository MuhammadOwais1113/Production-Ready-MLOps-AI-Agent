name: CI
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,training]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (Kubernetes, Airflow, MLflow, DVC CLI and the LLM are mocked)
        env:
          ANTHROPIC_API_KEY: ""      # forces the deterministic planner; CI never calls an external LLM
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          pytest -p no:cacheprovider

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image
        run: docker build -f Dockerfile.agent -t mlops-agent:ci .
