# Least-privilege identity for the agent when it runs inside the cluster.
# Read access to workloads + patch on deployments, limited to the approved namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent
  apiGroup: rbac.authorization.k8s.io
